name: Synthesized
description: >-
  Synthesized is an AI-native test data management (TDM) platform that automates
  the provisioning of production-realistic, privacy-preserving data for software
  testing, database migrations, CI/CD pipelines, and AI/ML validation. Its Test
  Data Kit (TDK) masks, subsets, and generates data across databases including
  PostgreSQL, MySQL, Oracle, SQL Server, SAP HANA and Db2, and enterprise
  applications like SAP, Oracle Fusion, Workday, Microsoft D365, ServiceNow and
  Salesforce. The Governor External API and first-party Python SDK (published to
  PyPI) let teams trigger masking and generation workflows programmatically and
  embed compliant synthetic data into their pipelines, with policy-driven masking
  aligned to GDPR, CCPA and CPRA.
