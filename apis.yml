apis:
- name: Governor External API
  description: >-
    REST API (OpenAPI 3.0.1, "Governor External API" v1.0.0) for the self-hosted
    Synthesized Governor. Trigger TDK masking/generation workflows, list workers,
    and check health. Authenticated with an X-Access-Key header. No downloadable
    spec is published — the reference is rendered client-side.
  humanURL: https://docs.synthesized.io/tdk/latest/user_guide/090_cicd/external_api_reference
  baseURL: https://your-governor-host/external/api/v1
  x-deployment: self-hosted (Docker Compose / Helm / AWS + GCP Marketplace); no vendor-hosted API host.
